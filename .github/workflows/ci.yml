name: CI/CD Pipeline

on:
  push:
    branches: [ main, beta ]
  pull_request:
    branches: [ main ]

# Add permissions for the workflow
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        node-version: [18, 20]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Node.js dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Run Python tests
      run: |
        source .venv/bin/activate
        python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Node.js dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build Alfred workflow
      run: |
        source .venv/bin/activate
        npm run build

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: gmail-search-tools-workflow-${{ github.ref_name }}
        path: dist/gmail-search-tools.alfredworkflow
        if-no-files-found: error

    - name: Read workflow version for stable release
      if: github.ref == 'refs/heads/main'
      id: stable_tag
      run: |
        VERSION=$(python - <<'PY'
        import plistlib
        with open('src/info.plist', 'rb') as f:
            data = plistlib.load(f)
        print(data.get('version', '').strip())
        PY
        )
        if [ -z "$VERSION" ]; then
          echo "Could not read version from src/info.plist"
          exit 1
        fi
        TAG="v${VERSION}"
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Generated stable tag: ${TAG}"

    - name: Generate unique tag for beta release
      if: github.ref == 'refs/heads/beta'
      id: beta_tag
      run: |
        VERSION=$(python - <<'PY'
        import plistlib
        with open('src/info.plist', 'rb') as f:
            data = plistlib.load(f)
        print(data.get('version', '').strip())
        PY
        )
        if [ -z "$VERSION" ]; then
          echo "Could not read version from src/info.plist"
          exit 1
        fi
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        TAG="v${VERSION}_${TIMESTAMP}"
        echo "tag=${TAG}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Generated beta tag: ${TAG}"

    - name: Create stable release (main branch)
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.stable_tag.outputs.tag }}
        name: Release ${{ steps.stable_tag.outputs.tag }}
        draft: false
        prerelease: false
        make_latest: true
        files: |
          dist/gmail-search-tools.alfredworkflow
        body: |
          ## Gmail Search Tools - Release ${{ steps.stable_tag.outputs.tag }}

          Quick access to Gmail Searching, Starred, Un-Read, Labels, Operators, and more.

          ## Power Search Gmail within the browser
          (Safari, Webkit, Orion, Google Chrome, Chromium, Opera, Vivaldi, Brave Browser, Microsoft Edge)

          ## 🔍 Keywords - (Customizable in Configuration)
        
          - `gms` — Gmail Search Messages, Stars (Filterable) 🔍
          - `gmu` — Gmail Un-Read Messages (Filterable) 📬
          - `gmo` — Gmail Search Operators (Filterable) 🧰
          - `gml` — Gmail Search Labels (Filterable) 🏷️
          - `gmsettings` — Workflow settings/actions menu 🛠️
          - `gmuser` — Fast User Switching 📌
          - `gmbrowser` — Select Target Browser 🌐
    
          ### Installation
          1. Download the `gmail-search-tools.alfredworkflow` file
          2. Double-click to install in Alfred
          3. Use `gms` to search Gmail, `gmu` to search Un-Read messages, etc.

          ## 🧑‍💻 Version Change Summary
  
          ### v0.0.0.1
          - 🚀 Initial release with `gms`, `gmu`, `gmo`, `gmss`, `gmuu`, `gmoo`, and `gmsettings` keywords.
          - 🔄 Added support for Gmail account switching.
          - 🔎 Added support for Gmail search operators, starred, and Un-Read messages.
          - ⚡ Added support for Gmail search fast phrases and clipboard text.
          
          ### v0.0.0.2
          - 🏷️ Support for Searching User Labels. `gml`, `gmll`
          - 🔢 Email Account Switching Support. `gmuser`
          
          ### v0.0.0.3
          - 🌐 Browser Selection Support. `target_browser` Under Configure Workflow.
          - 🧑‍💻 Support for Safari, Webkit, Orion, Google Chrome, Chromium, Opera, Vivaldi, Brave Browser, Microsoft Edge
          - ⚡ Quick change browser via `gmbrowser` keyword
          - 🔗 Link to change browser from `gmsettings` menu
          - 🐛 Improved Debugging to not include emails, labels, and fast phrases
          - 📖 Improved Documentation within Workflow for Readability
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create beta release (beta branch)
      if: github.ref == 'refs/heads/beta'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.beta_tag.outputs.tag }}
        name: Beta Release ${{ steps.beta_tag.outputs.tag }}
        draft: false
        prerelease: true
        make_latest: false
        files: |
          dist/gmail-search-tools.alfredworkflow
        body: |
          ## Gmail Search Tools - Beta ${{ steps.beta_tag.outputs.tag }}

          Quick access to Gmail Searching, Starred, Un-Read, Labels, Operators, and more.

          ## Power Search Gmail within the browser
          (Safari, Webkit, Orion, Google Chrome, Chromium, Opera, Vivaldi, Brave Browser, Microsoft Edge)

          ⚠️ This is a **beta release** built from the beta branch.

          ### Installation
          1. Download the `gmail-search-tools.alfredworkflow` file
          2. Double-click to install in Alfred
          3. Use `gms` to search Gmail, `gmu` to search Un-Read messages, etc.

          ## 🔍 Keywords - (Customizable in Configuration)

          - `gms` — Gmail Search Messages, Stars (Filterable) 🔍
          - `gmu` — Gmail Un-Read Messages (Filterable) 📬
          - `gmo` — Gmail Search Operators (Filterable) 🧰
          - `gml` — Gmail Search Labels (Filterable) 🏷️
          - `gmsettings` — Workflow settings/actions menu 🛠️
          - `gmuser` — Fast User Switching 📌
          - `gmbrowser` — Select Target Browser 🌐

          ### Version Change Summary
          ## 🧑‍💻 Version Change Summary
  
          ### v0.0.0.1
          - 🚀 Initial release with `gms`, `gmu`, `gmo`, `gmss`, `gmuu`, `gmoo`, and `gmsettings` keywords.
          - 🔄 Added support for Gmail account switching.
          - 🔎 Added support for Gmail search operators, starred, and Un-Read messages.
          - ⚡ Added support for Gmail search fast phrases and clipboard text.
          
          ### v0.0.0.2
          - 🏷️ Support for Searching User Labels. `gml`, `gmll`
          - 🔢 Email Account Switching Support. `gmuser`
          
          ### v0.0.0.3
          - 🌐 Browser Selection Support. `target_browser` Under Configure Workflow.
          - 🧑‍💻 Support for Safari, Webkit, Orion, Google Chrome, Chromium, Opera, Vivaldi, Brave Browser, Microsoft Edge
          - ⚡ Quick change browser via `gmbrowser` keyword
          - 🔗 Link to change browser from `gmsettings` menu
          - 🐛 Improved Debugging to not include emails, labels, and fast phrases
          - 📖 Improved Documentation within Workflow for Readability
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt flake8 black isort

    - name: Run Python code formatting check
      run: |
        source .venv/bin/activate
        black --check src/script/ tests/ || echo "Code formatting issues found (consider running 'black src/script/ tests/')"

    - name: Run Python import sorting check
      run: |
        source .venv/bin/activate
        isort --check-only src/script/ tests/ || echo "Import sorting issues found (consider running 'isort src/script/ tests/')"

    - name: Run Python linting
      run: |
        source .venv/bin/activate
        flake8 src/script/ tests/ --max-line-length=88 --extend-ignore=E203,W503 || echo "Linting issues found"
